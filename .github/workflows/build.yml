name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to read existing release tags for versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Determine next app version (1.1, 1.2, ...)
        id: version
        run: |
          latest_tag=$(git tag --list 'v1.*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            next_minor=1
          else
            next_minor=$(echo "$latest_tag" | sed -E 's/v[0-9]+\.([0-9]+).*/\1/' | awk '{print $1+1}')
          fi
          version_name="1.${next_minor}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest_tag:-none} -> next version: $version_name"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it before pushing to main."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/cigi-release.keystore

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not set."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=cigi-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=${{ steps.version.outputs.version_name }}

      - name: Upload Release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "Cigi v${{ steps.version.outputs.version_name }}"
          draft: false
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cigi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error