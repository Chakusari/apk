<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M256 80 L380 140 L380 260 Q380 360 256 430 Q132 360 132 260 L132 140 Z" fill="url(#shield)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- C letter -->
  <text x="256" y="300" text-anchor="middle" font-size="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-weight="800" fill="white" filter="url(#glow)" letter-spacing="-10">C</text>
  <!-- Small leaf/wing accent -->
  <circle cx="340" cy="170" r="24" fill="rgba(255,255,255,0.12)"/>
  <circle cx="340" cy="170" r="12" fill="rgba(255,255,255,0.2)"/>
</svg>
